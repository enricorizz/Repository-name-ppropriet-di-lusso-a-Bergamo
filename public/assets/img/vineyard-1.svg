<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tenuta con vigneto e dimora padronale">
  <defs>
    <linearGradient id="vy-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5b6b"/>
      <stop offset="0.55" stop-color="#a7ac8f"/>
      <stop offset="1" stop-color="#e8d3a3"/>
    </linearGradient>
    <linearGradient id="vy-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7a3f"/>
      <stop offset="1" stop-color="#3f4a24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#vy-sky)"/>
  <circle cx="950" cy="220" r="80" fill="#f3e2b0" opacity="0.45"/>
  <!-- hills -->
  <path d="M0 380 Q 300 330 600 360 T 1200 350 V460 H0 Z" fill="#7d8a5a" opacity="0.6"/>
  <!-- manor on the hill -->
  <g>
    <rect x="480" y="300" width="240" height="130" fill="#eae2d0"/>
    <polygon points="470,300 600,240 730,300" fill="#8a6b4a"/>
    <g fill="#3a3428">
      <rect x="510" y="330" width="34" height="54"/>
      <rect x="583" y="330" width="34" height="54"/>
      <rect x="656" y="330" width="34" height="54"/>
    </g>
    <rect x="583" y="390" width="34" height="40" fill="#4a3b28"/>
  </g>
  <g fill="#1a2717">
    <ellipse cx="420" cy="360" rx="26" ry="90"/>
    <ellipse cx="770" cy="360" rx="26" ry="90"/>
  </g>
  <!-- vineyard rows -->
  <rect y="430" width="1200" height="470" fill="url(#vy-field)"/>
  <g stroke="#2c3417" stroke-width="6" opacity="0.75">
    <path d="M-100 470 L 500 900"/>
    <path d="M60 470 L 660 900"/>
    <path d="M220 470 L 820 900"/>
    <path d="M380 470 L 980 900"/>
    <path d="M540 470 L 1140 900"/>
    <path d="M700 470 L 1300 900"/>
    <path d="M860 470 L 1460 900"/>
  </g>
  <g stroke="#8aa04f" stroke-width="10" opacity="0.5">
    <path d="M-90 500 L 470 880"/>
    <path d="M230 500 L 790 880"/>
    <path d="M550 500 L 1110 880"/>
  </g>
</svg>
