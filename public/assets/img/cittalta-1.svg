<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Skyline di Città Alta, Bergamo, al tramonto">
  <defs>
    <linearGradient id="ca-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="0.45" stop-color="#4a3f42"/>
      <stop offset="0.72" stop-color="#a06a45"/>
      <stop offset="1" stop-color="#d9a15c"/>
    </linearGradient>
    <radialGradient id="ca-sun" cx="0.7" cy="0.82" r="0.32">
      <stop offset="0" stop-color="#f6d79a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f6d79a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ca-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20201d"/>
      <stop offset="1" stop-color="#12120f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ca-sky)"/>
  <rect width="1600" height="900" fill="url(#ca-sun)"/>
  <circle cx="1120" cy="740" r="120" fill="#f7dfa6" opacity="0.55"/>
  <!-- far hills -->
  <path d="M0 640 Q 300 560 620 610 T 1200 590 T 1600 630 V900 H0 Z" fill="#5b4a48" opacity="0.55"/>
  <path d="M0 690 Q 380 620 760 670 T 1600 680 V900 H0 Z" fill="#40342f" opacity="0.7"/>
  <!-- city silhouette -->
  <g fill="url(#ca-hill)">
    <path d="M0 760 L0 900 L1600 900 L1600 740 Q 1400 720 1250 735 L 1180 700 L 1120 735 Q 980 715 860 730 L 820 690 L 780 730 Q 600 715 460 735 L 420 705 L 380 735 Q 200 725 0 760 Z"/>
  </g>
  <!-- Campanone tower -->
  <g fill="#171712">
    <rect x="742" y="470" width="46" height="230"/>
    <rect x="736" y="452" width="58" height="24"/>
    <rect x="758" y="430" width="14" height="24"/>
    <polygon points="736,452 765,410 794,452"/>
  </g>
  <!-- Basilica dome -->
  <g fill="#171712">
    <rect x="980" y="560" width="120" height="150"/>
    <path d="M980 560 Q 1040 470 1100 560 Z"/>
    <rect x="1034" y="452" width="12" height="30"/>
    <circle cx="1040" cy="452" r="9"/>
  </g>
  <!-- small rooftops with lit windows -->
  <g fill="#c9a24b" opacity="0.85">
    <rect x="470" y="690" width="8" height="10"/>
    <rect x="500" y="700" width="8" height="10"/>
    <rect x="560" y="695" width="8" height="10"/>
    <rect x="620" y="705" width="8" height="10"/>
    <rect x="900" y="700" width="8" height="10"/>
    <rect x="1180" y="705" width="8" height="10"/>
    <rect x="1240" y="712" width="8" height="10"/>
  </g>
</svg>
