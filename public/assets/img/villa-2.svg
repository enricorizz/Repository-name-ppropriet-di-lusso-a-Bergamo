<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Villa storica immersa nel parco">
  <defs>
    <linearGradient id="v2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4a52"/>
      <stop offset="0.55" stop-color="#8f8a76"/>
      <stop offset="1" stop-color="#c9b48f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#v2-sky)"/>
  <circle cx="270" cy="230" r="80" fill="#f3e2b0" opacity="0.45"/>
  <!-- park -->
  <rect y="600" width="1200" height="300" fill="#233020"/>
  <path d="M0 600 Q 300 560 600 590 T 1200 580 V640 H0 Z" fill="#2c3d24"/>
  <!-- gravel path -->
  <path d="M540 900 L600 620 L680 620 L740 900 Z" fill="#c9b48f" opacity="0.7"/>
  <!-- villa classic facade -->
  <g>
    <rect x="380" y="330" width="440" height="290" fill="#eae2d0"/>
    <polygon points="360,330 600,210 840,330" fill="#8a6b4a"/>
    <polygon points="410,330 600,236 790,330" fill="#a07f57"/>
    <!-- central pediment -->
    <polygon points="540,330 600,285 660,330" fill="#f4ecda"/>
    <!-- windows 3x3 -->
    <g fill="#3a352b">
      <rect x="430" y="380" width="48" height="80" rx="3"/>
      <rect x="530" y="380" width="48" height="80" rx="3"/>
      <rect x="630" y="380" width="48" height="80" rx="3"/>
      <rect x="730" y="380" width="48" height="80" rx="3"/>
      <rect x="430" y="500" width="48" height="80" rx="3"/>
      <rect x="730" y="500" width="48" height="80" rx="3"/>
    </g>
    <!-- central door -->
    <rect x="560" y="500" width="80" height="120" rx="4" fill="#4a3b28"/>
    <rect x="560" y="490" width="80" height="14" fill="#c9a24b"/>
    <!-- window trims -->
    <g stroke="#c9a24b" stroke-width="3" fill="none">
      <rect x="430" y="380" width="48" height="80"/>
      <rect x="530" y="380" width="48" height="80"/>
      <rect x="630" y="380" width="48" height="80"/>
      <rect x="730" y="380" width="48" height="80"/>
    </g>
  </g>
  <!-- cypress trees -->
  <g fill="#1a2717">
    <ellipse cx="180" cy="520" rx="34" ry="150"/>
    <ellipse cx="1030" cy="520" rx="34" ry="150"/>
    <ellipse cx="1110" cy="560" rx="30" ry="120"/>
  </g>
</svg>
