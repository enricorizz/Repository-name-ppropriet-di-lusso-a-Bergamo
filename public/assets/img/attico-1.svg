<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Terrazza di un attico con vista sulla città">
  <defs>
    <linearGradient id="at-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26303f"/>
      <stop offset="0.6" stop-color="#7c5a54"/>
      <stop offset="1" stop-color="#e0a866"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#at-sky)"/>
  <circle cx="900" cy="300" r="70" fill="#f6d79a" opacity="0.55"/>
  <!-- distant skyline -->
  <g fill="#33333a" opacity="0.7">
    <rect x="0" y="470" width="120" height="150"/>
    <rect x="140" y="430" width="90" height="190"/>
    <rect x="250" y="500" width="110" height="120"/>
    <rect x="900" y="450" width="100" height="170"/>
    <rect x="1020" y="490" width="90" height="130"/>
    <rect x="1120" y="440" width="80" height="180"/>
  </g>
  <!-- city dome middle -->
  <g fill="#2b2b31" opacity="0.85">
    <rect x="520" y="470" width="140" height="150"/>
    <path d="M520 470 Q 590 400 660 470 Z"/>
  </g>
  <g fill="#c9a24b" opacity="0.75">
    <rect x="30" y="500" width="7" height="9"/><rect x="60" y="520" width="7" height="9"/>
    <rect x="170" y="470" width="7" height="9"/><rect x="200" y="500" width="7" height="9"/>
    <rect x="930" y="490" width="7" height="9"/><rect x="1150" y="480" width="7" height="9"/>
  </g>
  <!-- terrace floor -->
  <rect y="640" width="1200" height="260" fill="#2c2a26"/>
  <g stroke="#413d36" stroke-width="3">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="770" x2="1200" y2="770"/>
    <line x1="0" y1="840" x2="1200" y2="840"/>
  </g>
  <!-- glass balustrade -->
  <rect y="600" width="1200" height="44" fill="#8fb0b8" opacity="0.28"/>
  <rect y="600" width="1200" height="6" fill="#c9a24b"/>
  <!-- lounge furniture -->
  <g fill="#141410">
    <rect x="180" y="690" width="240" height="70" rx="10"/>
    <rect x="180" y="660" width="240" height="40" rx="10"/>
    <rect x="470" y="705" width="90" height="55" rx="8"/>
  </g>
  <!-- planter -->
  <g fill="#1c2a1a"><ellipse cx="1000" cy="670" rx="60" ry="90"/></g>
  <rect x="960" y="700" width="80" height="80" fill="#26241f"/>
</svg>
