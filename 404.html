<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reindirizzamento in corso</title>
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #0d111b;
        color: #f5f7fb;
        text-align: center;
      }

      a {
        color: #d9b36c;
      }
    </style>
  </head>
  <body>
    <main>
      <p>La pagina richiesta non è disponibile. Ti stiamo riportando alla home.</p>
      <p><a id="home-link" href="/index.html">Apri la home</a></p>
    </main>
    <script>
      const repoPath = "/Repository-name-ppropriet-di-lusso-a-Bergamo/";
      const isProjectPage = window.location.hostname.endsWith("github.io");
      const homePath = isProjectPage ? `${repoPath}index.html` : "/index.html";
      const homeLink = document.getElementById("home-link");

      homeLink.href = homePath;
      window.location.replace(`${homePath}${window.location.hash}`);
    </script>
  </body>
</html>
